<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>货位推荐</title><link rel="stylesheet" href="/static/slotting.css"></head>
<body class="slotting-page"><nav><a href="/">产品列表</a><span>/</span>货位推荐</nav>
<main><section class="left"><section class="card information"><h1><span>▣</span> 基础信息</h1><h2>订单配置</h2><label>仓库 <select id="warehouse"><option value="wuhan">武汉联众城配项目</option></select></label></section>
<section class="card layout"><div class="layout-title"><h2>立体货架布局</h2><span>C14 · C15 · C16</span></div><div class="view-tools"><button id="perspective-view">立体视角</button><button id="top-view">俯视</button><label><select id="view-level" aria-label="显示层数"><option value="5">全部 5 层</option><option value="4">1—4 层</option><option value="3">1—3 层</option><option value="2">1—2 层</option><option value="1">第 1 层</option></select></label><select id="view-rack" aria-label="选择货架"><option value="">全部货架</option><option value="C14">C14</option><option value="C15">C15</option><option value="C16">C16</option></select></div><iframe id="layout" title="立体货架布局"></iframe><p id="layout-status" role="status">选择仓库后加载布局</p><p id="slot-detail" role="status">点击货位查看库存明细。</p></section></section>
<aside class="card"><h1 class="upload-title">☁ 数据上传</h1><section class="upload-section"><h2>当前现存量</h2><div class="dropzone"><span class="cloud">☁</span><label class="file-button">上传文件<input type="file" accept=".csv,.xlsx" data-kind="inventory"></label><p>支持格式：csv、xlsx</p><button data-sample="inventory">引入样例数据</button><p class="status" id="inventory-status" role="status">尚未加载</p></div><button class="details" data-details="inventory" disabled>查看数据明细</button></section>
<section class="upload-section"><h2>入库订单信息</h2><div class="dropzone"><span class="cloud">☁</span><label class="file-button">上传文件<input type="file" accept=".csv,.xlsx" data-kind="orders"></label><p>支持格式：csv、xlsx</p><button data-sample="orders">引入样例数据</button><p class="status" id="orders-status" role="status">尚未加载</p></div><button class="details" data-details="orders" disabled>查看数据明细</button></section>
<section class="upload-section"><h2>SKU 规格</h2><label class="file-button">上传补全后的规格<input id="specs-file" type="file" accept=".csv,.xlsx"></label><p id="specs-status">默认读取 data/sku.xlsx；托含量须为有效箱/托数。</p></section><div class="options"><label>层间距离权重 <input id="layer-weight" type="number" min="0" step="0.1" value="1" style="width:80px"></label><label>选择算法 <select id="algorithm"><option value="fifo">FIFO算法</option></select></label><input id="batch" type="checkbox" hidden><span>本次入库统一规划</span></div><div class="actions"><button id="plan" class="primary" disabled>开始规划</button><button id="result" disabled>查看结果</button></div><p id="message" role="status">请在算法设置中选择启发式，加载本次库存快照和订单后规划。FIFO用于出库选货；文件演示不连接远程平台。</p></aside></main>
<dialog id="details"><header><h2 id="details-title">数据明细</h2><button id="close-details">关闭</button></header><div class="table-wrap"><table><thead></thead><tbody></tbody></table></div><p id="warnings"></p></dialog>
<script src="/static/slotting.js?v=20261021-plan"></script></body></html>

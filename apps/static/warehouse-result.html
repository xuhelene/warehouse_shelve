<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立体库规划结果</title><link rel="stylesheet" href="/static/slotting.css"><style>main{display:block!important;height:auto!important;max-width:1500px}.card{margin-bottom:18px}.table-wrap{max-height:440px}svg{width:100%;height:520px;background:#f3f6f7}pre{white-space:pre-wrap;overflow-wrap:anywhere}.route{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:16px}#route-info{max-height:520px;overflow:auto}@media(max-width:740px){.route{grid-template-columns:1fr}}</style></head>
<body><nav><a href="/">产品列表</a><span>/</span><span id="title">规划结果</span></nav><main>
<section class="card"><h1 id="summary">正在加载…</h1><p id="meta"></p><pre id="warnings"></pre><a id="download" download>下载完整结果 JSON</a></section>
<section class="card"><h2>实际通道路线（米）</h2><div class="route"><div><label>搬运分段 <select id="route-select" style="min-width:0;max-width:100%"></select></label><pre id="route-info"></pre></div><svg id="map" role="img" aria-label="通道路线"></svg></div></section>
<section class="card"><h2>库位 / SKU / 入库时间及数量明细</h2><div class="table-wrap"><table id="details-table"></table></div></section>
<section class="card"><h2>缺货或未分配明细</h2><div class="table-wrap"><table id="shortages-table"></table></div></section>
<section class="card"><h2>推荐后预计剩余库存（下次规划须重新加载快照）</h2><div class="table-wrap"><table id="inventory-table"></table></div></section>
</main><script src="/static/warehouse-result.js"></script></body></html>

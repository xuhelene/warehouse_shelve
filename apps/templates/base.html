<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/portal.css?v={{ static_version }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <div class="page{% if wide_page %} page-wide{% endif %}">
    <div class="topbar">
      <a class="brand" href="/"><div class="brand-mark">WO</div><div>物流仓储优化演示系统</div></a>
      <div class="nav">
        {% for key, config in modules.items() %}
            <a class="nav-link{% if key == active_module_key %} active{% endif %}" href="/modules/{{ key }}">{{ config.title }}</a>
        {% endfor %}
      </div>
    </div>
    {% block body %}{% endblock %}
  </div>
  {% block body_extra %}{% endblock %}
</body>
</html>

{% extends "base.html" %}

{% block body %}
<section class="hero">
  <span class="eyebrow">Unified Portal</span>
  <h1>仓储优化 Web 入口</h1>
  <p class="sub">面向仓储物流领域的优化能力，支持多个求解器。</p>
  <a class="button" href="/warehouse-preview">三维货架预览</a>
</section>
<section class="card-grid">
  {% for key, config in modules.items() %}
  <div class="card">
    <div class="tag">module</div>
    <div class="card-title">{{ config.title }}</div>
    <p>{{ config.description }}</p>
    <div class="muted">默认求解器 {{ config.default_backend | upper }}</div>
    <div class="button-row">
      <a class="button" href="/modules/{{ key }}">进入模块</a>
    </div>
  </div>
  {% endfor %}
</section>
{% endblock %}
